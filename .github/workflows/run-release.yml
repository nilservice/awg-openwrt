name: Sync OpenWRT Releases

on:
  workflow_dispatch: # Возможность вручную запустить Action

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.check_release.outputs.release_exists }}
      release_tag: ${{ steps.get_release.outputs.release_tag }} 
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # Вместо получения последнего релиза OpenWRT — указываем вашу версию вручную
      - name: Set fixed OpenWRT version
        id: get_release
        run: |
          RELEASE_TAG="v24.10.7"
          RELEASE_NAME="OpenWRT 24.10.7"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Check if release exists in your repo
        id: check_release
        run: |
          # Используйте имя вашего репозитория вместо Slava-Shchipunov
          RELEASE_EXISTS=$(curl -s https://api.github.com/repos/YOUR_USERNAME/awg-openwrt/releases/tags/${{ steps.get_release.outputs.release_tag }} | jq -r .tag_name)
          if [ "$RELEASE_EXISTS" == "null" ]; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release in your repo
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          ART="
          \`\`\`
            _______                     ________        __
           |       |.-----.-----.-----.|  |  |  |.----.|  |_
           |   -   ||  _  |  -__|     ||  |  |  ||   _||   _|
           |_______||   __|_____|__|__||________||__|  |____|
                    |__| A M N E Z I A   W I R E G U A R D
          -----------------------------------------------------
          OpenWrt ${{ steps.get_release.outputs.release_tag }}
          -----------------------------------------------------
          \`\`\`"

          curl -X POST https://api.github.com/repos/YOUR_USERNAME/awg-openwrt/releases \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "${{ steps.get_release.outputs.release_tag }}" \
                    --arg name "Build amnezia wg for all devices with openwrt ${{ steps.get_release.outputs.release_tag }}" \
                    --arg body "$ART" \
                    '{ tag_name: $tag, name: $name, body: $body }')"
  
  run-build:
    runs-on: ubuntu-latest
    needs: sync-releases
    if: needs.sync-releases.outputs.release_exists == 'false'
    # Замените Slava-Shchipunov на ваше имя пользователя
    uses: nilservice/awg-openwrt/.github/workflows/build-module.yml@master
    with:
      tag_name: ${{ needs.sync-releases.outputs.release_tag }}
      target: ramips
      subtarget: mt7621
      pkgarch: mipsel_24kc
      vermagic: f31f6f85a36836e510d64a18a9a5f1bf-r1
