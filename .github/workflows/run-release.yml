name: Sync and Build OpenWRT Releases

on:
  workflow_dispatch: # Ручной запуск

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set fixed OpenWRT version
        id: get_release
        run: |
          RELEASE_TAG="v24.10.7"
          RELEASE_NAME="OpenWRT 24.10.7"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Check if release exists in your repo
        id: check_release
        run: |
          RELEASE_EXISTS=$(curl -s https://api.github.com/repos/nilservice/awg-openwrt/releases/tags/${{ steps.get_release.outputs.release_tag }} | jq -r .tag_name)
          if [ "$RELEASE_EXISTS" == "null" ]; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release in your repo
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          ART="
          \`\`\`
            _______                     ________        __
           |       |.-----.-----.-----.|  |  |  |.----.|  |_
           |   -   ||  _  |  -__|     ||  |  |  ||   _||   _|
           |_______||   __|_____|__|__||________||__|  |____|
                    |__| A M N E Z I A   W I R E G U A R D
          -----------------------------------------------------
          OpenWrt ${{ steps.get_release.outputs.release_tag }}
          -----------------------------------------------------
          \`\`\`"

          curl -X POST https://api.github.com/repos/nilservice/awg-openwrt/releases \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "${{ steps.get_release.outputs.release_tag }}" \
                    --arg name "Build amnezia wg for all devices with openwrt ${{ steps.get_release.outputs.release_tag }}" \
                    --arg body "$ART" \
                    '{ tag_name: $tag, name: $name, body: $body }')"

      - name: Build packages
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          # 1. Скачиваем SDK
          echo "=== Скачиваем SDK ==="
          wget https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621/openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst

          # 2. Распаковываем SDK
          echo "=== Распаковываем SDK ==="
          tar -xf openwrt-sdk-*.tar.zst

          # 3. Клонируем исходники AmneziaWG
          echo "=== Клонируем исходники ==="
          git clone https://github.com/Slava-Shchipunov/awg-openwrt.git

          # 4. Находим папку SDK
          SDK_DIR=$(ls -d openwrt-sdk-*/)
          echo "=== Папка SDK: $SDK_DIR ==="

          # 5. Копируем исходники в package
          echo "=== Копируем исходники в SDK ==="
          mkdir -p $SDK_DIR/package/amneziawg
          cp -r awg-openwrt/* $SDK_DIR/package/amneziawg/

          # 6. Проверяем структуру
          echo "=== Проверка структуры package/amneziawg ==="
          ls -la $SDK_DIR/package/amneziawg/

          # 7. Переходим в SDK
          cd $SDK_DIR

          # 8. Обновляем список пакетов
          echo "=== Обновляем список пакетов ==="
          make package/symlinks

          # 9. Настраиваем конфигурацию
          echo "=== Настраиваем конфигурацию ==="
          echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          make defconfig

          # 10. Собираем пакеты по отдельности
          echo "=== Собираем kmod-amneziawg ==="
          make package/amneziawg/kmod-amneziawg/compile V=s -j$(nproc) || echo "kmod-amneziawg build failed"

          echo "=== Собираем amneziawg-tools ==="
          make package/amneziawg/amneziawg-tools/compile V=s -j$(nproc) || echo "amneziawg-tools build failed"

          echo "=== Собираем luci-proto-amneziawg ==="
          make package/amneziawg/luci-proto-amneziawg/compile V=s -j$(nproc) || echo "luci-proto-amneziawg build failed"

          # 11. Ищем собранные пакеты
          echo "=== Поиск собранных пакетов ==="
          find bin/ -name "*.ipk" -type f

          # 12. Копируем найденные пакеты
          echo "=== Копируем пакеты ==="
          mkdir -p ../packages
          find bin/ -name "*.ipk" -type f -exec cp {} ../packages/ \;

          # 13. Проверяем, что пакеты скопировались
          echo "=== Проверка пакетов ==="
          ls -la ../packages/

          # 14. Возвращаемся в корень
          cd ..

          # 15. Загружаем пакеты в релиз
          echo "=== Загружаем пакеты в релиз ==="
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nilservice/awg-openwrt/releases/tags/${{ steps.get_release.outputs.release_tag }} \
            | jq -r .id)

          if [ "$RELEASE_ID" != "null" ]; then
            for file in packages/*.ipk; do
              if [ -f "$file" ]; then
                echo "Загружаем: $file"
                curl -X POST \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$file" \
                  "https://uploads.github.com/repos/nilservice/awg-openwrt/releases/$RELEASE_ID/assets?name=$(basename $file)"
              fi
            done
          else
            echo "Релиз не найден, пропускаем загрузку"
          fi
