- name: Build packages
  if: steps.check_release.outputs.release_exists == 'false'
  run: |
    # 1. Скачиваем SDK
    echo "=== Скачиваем SDK ==="
    wget https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621/openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    # 2. Распаковываем SDK
    echo "=== Распаковываем SDK ==="
    tar -xf openwrt-sdk-*.tar.zst

    # 3. Клонируем исходники AmneziaWG
    echo "=== Клонируем исходники ==="
    git clone https://github.com/Slava-Shchipunov/awg-openwrt.git

    # 4. Находим папку SDK
    SDK_DIR=$(ls -d openwrt-sdk-*/)
    echo "=== Папка SDK: $SDK_DIR ==="

    # 5. Копируем исходники в package (важно: копируем содержимое, а не папку!)
    echo "=== Копируем исходники в SDK ==="
    mkdir -p $SDK_DIR/package/amneziawg
    cp -r awg-openwrt/* $SDK_DIR/package/amneziawg/

    # 6. Проверяем структуру
    echo "=== Проверка структуры package/amneziawg ==="
    ls -la $SDK_DIR/package/amneziawg/
    echo "=== Проверка наличия подпапок ==="
    ls -la $SDK_DIR/package/amneziawg/amneziawg-tools/
    ls -la $SDK_DIR/package/amneziawg/kmod-amneziawg/
    ls -la $SDK_DIR/package/amneziawg/luci-proto-amneziawg/

    # 7. Переходим в SDK
    cd $SDK_DIR

    # 8. Обновляем список пакетов
    echo "=== Обновляем список пакетов ==="
    make package/symlinks

    # 9. Настраиваем конфигурацию
    echo "=== Настраиваем конфигурацию ==="
    echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> .config
    echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
    echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
    make defconfig

    # 10. Собираем пакеты (исправленная команда!)
    echo "=== Собираем пакеты ==="
    make package/amneziawg/compile V=s -j$(nproc)

    # 11. Копируем готовые пакеты
    echo "=== Копируем пакеты ==="
    mkdir -p ../packages
    cp bin/packages/mipsel_24kc/amneziawg/*.ipk ../packages/ 2>/dev/null || echo "No packages found"

    # 12. Возвращаемся в корень
    cd ..

    # 13. Загружаем пакеты в релиз
    echo "=== Загружаем пакеты в релиз ==="
    for file in packages/*.ipk; do
      if [ -f "$file" ]; then
        echo "Загружаем: $file"
        curl -X POST https://uploads.github.com/repos/nilservice/awg-openwrt/releases/${{ steps.get_release.outputs.release_tag }}/assets \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"$file"
      else
        echo "Нет файлов для загрузки"
      fi
    done
