name: Sync and Build OpenWRT Releases

on:
  workflow_dispatch: # Ручной запуск

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set fixed OpenWRT version
        id: get_release
        run: |
          RELEASE_TAG="v24.10.7"
          RELEASE_NAME="OpenWRT 24.10.7"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Check if release exists in your repo
        id: check_release
        run: |
          RELEASE_EXISTS=$(curl -s https://api.github.com/repos/ВАШЕ_ИМЯ_ПОЛЬЗОВАТЕЛЯ/awg-openwrt/releases/tags/${{ steps.get_release.outputs.release_tag }} | jq -r .tag_name)
          if [ "$RELEASE_EXISTS" == "null" ]; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            echo "release_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release in your repo
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          ART="
          \`\`\`
            _______                     ________        __
           |       |.-----.-----.-----.|  |  |  |.----.|  |_
           |   -   ||  _  |  -__|     ||  |  |  ||   _||   _|
           |_______||   __|_____|__|__||________||__|  |____|
                    |__| A M N E Z I A   W I R E G U A R D
          -----------------------------------------------------
          OpenWrt ${{ steps.get_release.outputs.release_tag }}
          -----------------------------------------------------
          \`\`\`"

          curl -X POST https://api.github.com/repos/ВАШЕ_ИМЯ_ПОЛЬЗОВАТЕЛЯ/awg-openwrt/releases \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "${{ steps.get_release.outputs.release_tag }}" \
                    --arg name "Build amnezia wg for all devices with openwrt ${{ steps.get_release.outputs.release_tag }}" \
                    --arg body "$ART" \
                    '{ tag_name: $tag, name: $name, body: $body }')"

      - name: Build packages
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          # Клонируем исходники AmneziaWG
          git clone https://github.com/Slava-Shchipunov/awg-openwrt.git

          # Переходим в папку с распакованным SDK
          cd openwrt-sdk-*/

          # Копируем исходники в папку package SDK
          cp -r ../awg-openwrt package/amneziawg

          # Настраиваем сборку
          echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          make defconfig

          # Собираем пакеты
          make package/amneziawg/compile V=s
          
          # Копируем собранные пакеты в корень
          cp bin/packages/mipsel_24kc/amneziawg/*.ipk ../../
          cd ../../
          
          # Загружаем пакеты в релиз
          for file in *.ipk; do
            curl -X POST https://uploads.github.com/repos/nilservice/awg-openwrt/releases/${{ steps.get_release.outputs.release_tag }}/assets \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"
          done
